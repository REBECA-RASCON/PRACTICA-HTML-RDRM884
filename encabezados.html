<!DOCTYPE html> <!-- este es un documento escrito en html5 -->
<html lang = "es"> <!-- el sitio esta principalmente en algun idioma,"es" significa español-->


<head> <!-- la primera etiqueta de un contenedor al principio del sitio llamada head -->
	<meta charset="UTF-8"> <!-- para especificar la codificacion de caracteres-->
	<meta name="viewport" content="width=device-width, initial scale=1.0"> <!--condiciones de la area de la ventana que se puede ver en el sitio-->
	<title> encabezados html </title> <!-- es el tiulo del sitio web, se observa en la pestaña-->
</head> <!-- el cierre de la etiqueta head-->

<body> <!-- inicio de la primer etiqueta donde se contiene todo el contenido visible-->
	<h1>titulo 1</h1> <!-- etiquetas del encabezado mas grande-->
	<h2>titulo 2</h2> <!-- etiquetas de un encabezo con menos importancia-->
	<h3>titulo 3</h3> <!--etiquetas de un encabezado mas pequeño aun-->
	<h4>titulo 4</h4> <!-- un encabezado de poca importancia-->
	<h5>titulo 5</h5> <!-- un encabezado de muy poca importancia-->
	<h6>titulo 6</h6> <!-- un encabezado muy pequeño-->
</body> <!-- la etiqueta que indica el cierre de body-->

</html> <!-- se cierra el documento html-->
